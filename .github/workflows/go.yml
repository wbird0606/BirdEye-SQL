# CI 佔位設定 —— 目前無 remote，尚未啟用（見 ADR 0003 決策脈絡的 grilling 紀錄）。
# 推上 GitHub 後即自動生效。
name: go

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./... -race -cover
