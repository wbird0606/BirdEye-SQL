name: Go CI

# 本倉庫之 Actions 僅允許倉庫內部與帳號自行 fork 之 action（allowed_actions = local_only），
# 因此只使用 wbird0606/checkout；Go 使用 GitHub-hosted runner 預裝版本，其餘以指令執行。

on:
  push:
    branches: [main, go]
  pull_request:
    branches: [main, go]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: wbird0606/checkout@v4
      - name: Go version
        run: go version
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1 -cover

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: wbird0606/checkout@v4
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: wbird0606/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (working tree only)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            dir /repo --no-banner --redact --exit-code 1
